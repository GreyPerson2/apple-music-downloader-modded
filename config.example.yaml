media-user-token: "your-media-user-token" # required for lyrics/aac-lc/MV for subscribed accounts
authorization-token: "your-authorization-token" # optional; the app can usually auto-fetch a token

# supportedLanguage by each storefront --> https://gist.github.com/itouakirai/c8ba9df9dc65bd300094103b058731d0
language: "" # e.g. "en-US"

lrc-type: "lyrics" # lyrics | syllable-lyrics
lrc-format: "lrc"  # lrc | ttml
embed-lrc: false
save-lrc-file: true

save-artist-cover: false
save-animated-artwork: false # If enabled, requires ffmpeg
emby-animated-artwork: false # If enabled, requires ffmpeg

embed-cover: true
cover-size: 3000x3000
cover-format: jpg # jpg | png | original

# Output folders (use relative paths by default; customize as needed)
alac-save-folder: "AM-DL-ALAC downloads"
atmos-save-folder: "AM-DL-Atmos downloads"
aac-save-folder: "AM-DL-AAC downloads"
mv-save-folder: "AM-DL-MV downloads"

max-memory-limit: 256 # MB

# Wrapper/device helper
decrypt-m3u8-port: "127.0.0.1:10020"
get-m3u8-port: "127.0.0.1:20020"
get-m3u8-from-device: true

# set 'all' to retrieve all m3u8, and set 'hires' to only detect hires m3u8.
get-m3u8-mode: hires # all | hires

# Audio selection
aac-type: aac-lc # aac-lc | aac | aac-binaural | aac-downmix
alac-max: 48000  # 192000 | 96000 | 48000 | 44100
atmos-max: 2768  # 2768 | 2448

# Template/path limits
limit-max: 200
path-part-max: 200
path-part-trim-vars: ["{ArtistName}", "{AlbumName}", "{PlaylistName}", "{SongName}"]

# Control which metadata is embedded into the output media.
# If omitted/empty, the program uses its default list.
embed-metadata:
  - title
  - artist
  - album
  - album_artist
  - composer
  - album_created
  - genre
  - created
  - tracknum
  - disk
  - lyrics
  - cover
  - copyright
  - record_company
  - upc
  - isrc
  - rtng
  - song_id
  - album_id
  - artist_id

# {AlbumId} {AlbumName} {ArtistName} {ReleaseDate} {ReleaseYear} {UPC} {Copyright} {Quality} {Codec} {Tag} {RecordLabel}
album-folder-format: "{AlbumName} {Tag} [{AlbumId}][{Quality}-{Codec}]"

# {PlaylistId} {PlaylistName} {ArtistName} {Quality} {Codec} {Tag}
playlist-folder-format: "{PlaylistName}"

# {SongId} {SongNumer} {SongName} {DiscNumber} {TrackNumber} {Quality} {Codec} {Tag}
song-file-format: "{DiscNumber}.{SongNumer}. {SongName}"

# {ArtistId} {ArtistName}/{UrlArtistName}
artist-folder-format: "{ArtistName} [{ArtistId}]"

# If set "", will not add tag
explicit-choice: "[E]"
clean-choice: "[C]"
apple-master-choice: "[M]"

# If true, for playlist will use song info for meta (albumname/track/disk)
use-songinfo-for-playlist: false
dl-albumcover-for-playlist: false

# Music video
mv-audio-type: atmos # atmos | ac3 | aac
mv-max: 2160

# Storefront used for searching. 2-letter country code in Apple Music URLs (jp, us, ca, ...).
storefront: "us"

# Conversion settings (requires ffmpeg)
convert-after-download: false
convert-format: "flac" # flac | mp3 | opus | wav | copy (no re-encode)
convert-keep-original: false
convert-skip-if-source-matches: true
ffmpeg-path: "ffmpeg"
convert-extra-args: ""
convert-with-metadata: true
convert-warn-lossy-to-lossless: true
convert-skip-lossy-to-lossless: true
convert-check-bad-alac: false
convert-delete-bad-alac: false

# Time-range filtering: only download albums released on or after the given date.
# When time-range-download is true, albums released before time-range are excluded.
time-range-download: false
time-range: "DD-MM-YYYY" # e.g. "25-05-2026"

